# Builds and publishes the site. Runs on every change, plus once a night
# so new Substack posts show up on the homepage without anyone touching it.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"  # about 5am Toronto time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest Substack posts
        run: python3 scripts/fetch_substack.py
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
