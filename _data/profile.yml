about: >-
  I am an 18-year-old Canadian U19 cyclist from Ontario, currently racing in
  both track and road disciplines for the Milton Revolution U23 Project. As a
  World Champion, Canadian Track Champion and National Record holder, I have
  proudly represented Canada at the 2025 and 2026 UCI Junior Track World
  Championships and competed in major UCI road events such as the Tour de
  l'Abitibi Femmes, Tour du Gévaudan Occitanie femmes and In Flanders Fields.

about_2: >-
  My dual-discipline background has built a strong aerobic engine, allowing me
  to deliver sustained power while maintaining patience and tactical awareness.
  Above all, I am a dedicated and consistent, team-first rider who is fully
  committed to doing the hard work, whether pacing, covering moves, or
  protecting a leader, that creates success for the collective team.
